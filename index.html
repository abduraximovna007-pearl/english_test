<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingliz Tili Testi – 1-kurs</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f14;
    --surface: #16181f;
    --surface2: #1e2029;
    --border: #2a2d3a;
    --accent: #5b8dee;
    --accent2: #7c6df7;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
    --text: #e8eaf0;
    --muted: #7b829a;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1a1d2e 0%, #12141c 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 32px 22px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .header-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--text);
    flex: 1;
    min-width: 200px;
  }
  .header-title span { color: var(--accent); }
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 2;
    min-width: 250px;
  }
  .progress-bar-outer {
    flex: 1;
    height: 8px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .progress-label { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
  .score-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 6px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
  }

  /* MAIN */
  .main { max-width: 780px; margin: 0 auto; padding: 40px 24px 100px; }

  /* QUESTION CARD */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 28px;
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .q-card.answered-correct { border-color: var(--green); }
  .q-card.answered-wrong { border-color: var(--red); }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 20px 22px 16px;
    border-bottom: 1px solid var(--border);
  }
  .q-num {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 0.78rem;
    font-weight: 700;
    border-radius: 8px;
    min-width: 36px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.04em;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .q-text {
    font-size: 1.0rem;
    line-height: 1.65;
    color: var(--text);
    white-space: pre-wrap;
  }
  .q-status {
    margin-left: auto;
    font-size: 1.2rem;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .q-card.answered-correct .q-status { opacity: 1; }
  .q-card.answered-wrong .q-status { opacity: 1; }

  /* OPTIONS */
  .options { padding: 16px 22px 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 13px 18px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .option-btn:not(.disabled):hover {
    border-color: var(--accent);
    background: #1e2540;
    transform: translateX(3px);
  }
  .option-btn.disabled { cursor: not-allowed; }
  .option-btn.selected-correct {
    background: rgba(52,211,153,0.12);
    border-color: var(--green);
    color: var(--green);
  }
  .option-btn.selected-wrong {
    background: rgba(248,113,113,0.12);
    border-color: var(--red);
    color: var(--red);
  }
  .option-btn.reveal-correct {
    background: rgba(52,211,153,0.07);
    border-color: var(--green);
    color: var(--green);
  }
  .opt-letter {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--border);
    font-size: 0.78rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.18s;
  }
  .selected-correct .opt-letter { background: var(--green); color: #0a1a12; }
  .selected-wrong .opt-letter { background: var(--red); color: #1a0808; }
  .reveal-correct .opt-letter { background: var(--green); color: #0a1a12; }

  /* RESULT SCREEN */
  #result-screen {
    display: none;
    text-align: center;
    padding: 60px 24px;
    animation: fadeIn 0.5s ease;
  }
  #result-screen.show { display: block; }
  .result-emoji { font-size: 5rem; margin-bottom: 16px; }
  .result-title {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    margin-bottom: 8px;
  }
  .result-title.great { color: var(--green); }
  .result-title.good { color: var(--yellow); }
  .result-title.ok { color: #fb923c; }
  .result-title.retry { color: var(--red); }
  .result-sub { color: var(--muted); font-size: 1.05rem; margin-bottom: 36px; }

  .result-stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }
  .stat-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 32px;
    min-width: 140px;
  }
  .stat-num { font-size: 2.4rem; font-weight: 700; margin-bottom: 4px; }
  .stat-num.correct { color: var(--green); }
  .stat-num.wrong { color: var(--red); }
  .stat-num.pct { color: var(--accent); }
  .stat-label { color: var(--muted); font-size: 0.85rem; }

  .result-grade {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: inline-block;
    padding: 18px 40px;
    margin-bottom: 36px;
    font-size: 1.1rem;
  }
  .grade-val { font-size: 2.6rem; font-weight: 700; color: var(--accent); }

  .retry-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px 48px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.2s;
  }
  .retry-btn:hover { opacity: 0.88; transform: translateY(-2px); }

  /* SUBMIT BAR */
  .submit-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(14,15,20,0.95);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .submit-info { color: var(--muted); font-size: 0.9rem; }
  .submit-info strong { color: var(--text); }
  .submit-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 36px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.2s;
  }
  .submit-btn:hover { opacity: 0.88; transform: translateY(-1px); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }
  .q-card { animation: fadeIn 0.3s ease backwards; }

  /* Responsive */
  @media(max-width:580px) {
    .header { padding: 18px 16px 14px; gap: 12px; }
    .main { padding: 24px 14px 80px; }
    .q-header, .options { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>

const letters = ['A','B','C','D'];
let state = {}; // qIndex -> selectedOptionIndex

function buildQuiz() {
  const container = document.getElementById('quiz-main');
  container.innerHTML = '';
  QUESTIONS.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + qi;
    card.style.animationDelay = Math.min(qi * 0.03, 1.5) + 's';

    // Question text cleanup: remove repeated instruction lines if same as previous
    let qText = q.question;
    // If it has a newline, make the instruction line slightly muted
    let qHtml = qText.replace(/\n/g, '\n');

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">${qi+1}</div>
        <div class="q-text">${escHtml(qText)}</div>
        <div class="q-status" id="status-${qi}"></div>
      </div>
      <div class="options" id="opts-${qi}">
        ${q.options.map((opt, oi) => `
          <button class="option-btn" id="opt-${qi}-${oi}" onclick="selectOption(${qi},${oi})">
            <span class="opt-letter">${letters[oi]||oi+1}</span>
            ${escHtml(opt.text)}
          </button>
        `).join('')}
      </div>`;
    container.appendChild(card);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function selectOption(qi, oi) {
  if (state[qi] !== undefined) return; // already answered
  state[qi] = oi;
  
  const q = QUESTIONS[qi];
  const isCorrect = q.options[oi].correct;
  const card = document.getElementById('card-' + qi);
  const statusEl = document.getElementById('status-' + qi);
  
  // Disable all options
  q.options.forEach((_, i) => {
    const btn = document.getElementById(`opt-${qi}-${i}`);
    btn.classList.add('disabled');
    if (i === oi) {
      btn.classList.add(isCorrect ? 'selected-correct' : 'selected-wrong');
    }
    if (!isCorrect && q.options[i].correct) {
      btn.classList.add('reveal-correct');
    }
  });

  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');
  statusEl.textContent = isCorrect ? '✅' : '❌';

  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(state).length;
  const correct = Object.keys(state).filter(qi => QUESTIONS[qi].options[state[qi]].correct).length;
  const wrong = answered - correct;
  const total = QUESTIONS.length;

  document.getElementById('progressBar').style.width = (answered/total*100).toFixed(1) + '%';
  document.getElementById('progressLabel').textContent = answered + ' / ' + total;
  document.getElementById('scoreBadge').innerHTML = `✓ ${correct} &nbsp;✗ ${wrong}`;
  document.getElementById('answeredCount').textContent = answered;
}

function submitQuiz() {
  const answered = Object.keys(state).length;
  if (answered === 0) { alert("Hech bo'lmaganda bitta savolga javob bering!"); return; }
  
  const total = QUESTIONS.length;
  const correct = Object.keys(state).filter(qi => QUESTIONS[qi].options[state[qi]].correct).length;
  const wrong = answered - correct;
  const pct = Math.round(correct / total * 100);

  document.getElementById('quiz-main').style.display = 'none';
  document.getElementById('submitBar').style.display = 'none';
  
  const rs = document.getElementById('result-screen');
  rs.classList.add('show');
  
  document.getElementById('resCorrect').textContent = correct;
  document.getElementById('resWrong').textContent = wrong;
  document.getElementById('resPct').textContent = pct + '%';

  let emoji, title, titleClass, sub, grade;
  if (pct >= 90) { emoji='🏆'; title="A'lo darajada!"; titleClass='great'; sub="Siz ajoyib natijalarga erishdingiz!"; grade='5'; }
  else if (pct >= 75) { emoji='🎯'; title="Yaxshi natija!"; titleClass='good'; sub="Bilimlaringiz yaxshi darajada!"; grade='4'; }
  else if (pct >= 55) { emoji='📚'; title="O'rtacha"; titleClass='ok'; sub="Yana o'qish foydali bo'ladi."; grade='3'; }
  else { emoji='💪'; title="Harakat qiling!"; titleClass='retry'; sub="Ko'proq mashq qilish kerak."; grade='2'; }

  document.getElementById('resultEmoji').textContent = emoji;
  const titleEl = document.getElementById('resultTitle');
  titleEl.textContent = title;
  titleEl.className = 'result-title ' + titleClass;
  document.getElementById('resultSub').textContent = sub + ` (${correct}/${total} savol to'g'ri)`;
  document.getElementById('resGrade').textContent = grade;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartQuiz() {
  state = {};
  document.getElementById('result-screen').classList.remove('show');
  document.getElementById('quiz-main').style.display = '';
  document.getElementById('submitBar').style.display = '';
  buildQuiz();
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
updateProgress();
</script>
</body>
</html>
